<svg width="900" height="1200" viewBox="0 0 900 1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c1a12"/>
      <stop offset="100%" stop-color="#0e0d09"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#e8c94a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#e8c94a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="900" height="1200" fill="url(#bg)"/>
  <rect width="900" height="1200" fill="url(#glow)"/>
  <!-- diagonal accent stripes -->
  <g opacity="0.5">
    <polygon points="0,900 900,700 900,760 0,960" fill="#e8c94a" opacity="0.10"/>
    <polygon points="0,980 900,780 900,800 0,1000" fill="#e8c94a" opacity="0.18"/>
  </g>
  <!-- softball -->
  <g transform="translate(450,470)">
    <circle r="190" fill="#f4f1e6"/>
    <circle r="190" fill="none" stroke="#0e0d09" stroke-width="6" opacity="0.15"/>
    <path d="M -140 -110 Q -40 -20 -60 130 Q -100 190 -160 210" fill="none" stroke="#c1272d" stroke-width="10" stroke-linecap="round"/>
    <path d="M 140 -110 Q 40 -20 60 130 Q 100 190 160 210" fill="none" stroke="#c1272d" stroke-width="10" stroke-linecap="round"/>
    <g stroke="#c1272d" stroke-width="4" opacity="0.9">
      <line x1="-132" y1="-96" x2="-118" y2="-86"/>
      <line x1="-118" y1="-70" x2="-104" y2="-60"/>
      <line x1="-104" y1="-44" x2="-90" y2="-34"/>
      <line x1="132" y1="-96" x2="118" y2="-86"/>
      <line x1="118" y1="-70" x2="104" y2="-60"/>
      <line x1="104" y1="-44" x2="90" y2="-34"/>
    </g>
  </g>
  <!-- bat -->
  <g transform="translate(450,470) rotate(-32)">
    <rect x="-16" y="-330" width="32" height="230" rx="16" fill="#caa26a"/>
    <rect x="-22" y="-110" width="44" height="140" rx="20" fill="#a9793f"/>
  </g>
  <text x="450" y="1080" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="34" letter-spacing="6" fill="#e8c94a" opacity="0.85">SOFTBALL</text>
</svg>
